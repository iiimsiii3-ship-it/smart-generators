<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المولدات الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#1b2333;--mute:#6b7488;--line:#e3e7ef;
  --pri:#f59e0b;--pri2:#d97706;--side:#121a2b;--side2:#1c2740;
  --ok:#16a34a;--bad:#dc2626;--warn:#ea580c;--info:#2563eb;
  --okbg:#e8f7ee;--badbg:#fdecec;--warnbg:#fff3e6;--infobg:#e9f0ff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1320;--card:#162033;--ink:#e6ebf5;--mute:#93a0b8;--line:#25324a;
  --side:#0a0f1a;--side2:#16213a;--okbg:#10301f;--badbg:#3a1414;--warnbg:#3a240f;--infobg:#132446;}}
:root[data-theme="dark"]{
  --bg:#0d1320;--card:#162033;--ink:#e6ebf5;--mute:#93a0b8;--line:#25324a;
  --side:#0a0f1a;--side2:#16213a;--okbg:#10301f;--badbg:#3a1414;--warnbg:#3a240f;--infobg:#132446;}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#cfd6e4;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px 16px;font-weight:800;font-size:17px;color:#fff;display:flex;gap:8px;align-items:center;border-bottom:1px solid #22304d}
.brand span{background:var(--pri);color:#121a2b;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:18px}
nav a{display:flex;gap:10px;align-items:center;padding:10px 18px;color:#cfd6e4;text-decoration:none;cursor:pointer;border-right:3px solid transparent}
nav a:hover{background:var(--side2)}
nav a.on{background:var(--side2);color:#fff;border-right-color:var(--pri)}
nav .sec{padding:14px 18px 4px;font-size:11px;color:#6f7d99}
main{flex:1;padding:20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px}
.menu-btn{display:none}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mute)}
.btn{border:0;background:var(--pri);color:#1b2333;font-family:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--pri2)}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.r{background:var(--bad);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.tools input,.tools select{width:auto;min-width:160px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:700;background:var(--bg)}
td input{min-width:90px}
.tag{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}
.t-warn{background:var(--warnbg);color:var(--warn)}.t-info{background:var(--infobg);color:var(--info)}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bars b{width:100%;max-width:38px;border-radius:5px 5px 0 0;display:block}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:560px}
.mbox h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.form .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.muted{color:var(--mute)}
.toast{position:fixed;bottom:20px;left:20px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;z-index:99}
.toast.on{opacity:1}
#printArea{display:none}
#portal{display:none;max-width:760px;margin:0 auto;padding:20px 16px}
#portal .hero{background:linear-gradient(135deg,#121a2b,#24365c);color:#fff;border-radius:14px;padding:20px;margin-bottom:14px}
#portal .hero .big{font-size:30px;font-weight:800;margin:6px 0}
.thumb{max-width:70px;max-height:70px;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.match{border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;margin-top:6px}
@media print{
  body *{visibility:hidden}#printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0;padding:20px;color:#000;background:#fff}
}
@media (max-width:820px){
  aside{position:fixed;right:-240px;z-index:40;transition:.25s}aside.on{right:0}
  .menu-btn{display:inline-block}main{padding:14px 16px}
  .form{grid-template-columns:1fr}.k2{grid-template-columns:1fr}
  .tools input,.tools select{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><span>⚡</span> المولدات الذكي</div>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="top">
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn g menu-btn" onclick="side.classList.toggle('on')">☰</button>
      <h1 id="title"></h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="muted" id="today"></span>
      <button class="btn g sm" onclick="toggleTheme()">🌓</button>
    </div>
  </div>
  <div id="view"></div>
</main>
</div>
<div id="portal"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ===================== البيانات ===================== */
const KEY='genSmartSys_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>today().slice(0,7);
let DB;
function seed(){
  const g1=uid(),g2=uid(),s=[];
  const names=['أبو أحمد السوافيري','محمد عبد الله','بقالة النور','خالد الشاعر','سامي أبو عودة','صيدلية الشفاء','أم يوسف','محل الأمل للاتصالات'];
  names.forEach((n,i)=>s.push({id:uid(),name:n,phone:'059'+(1000000+i*13579),area:i%2?'الحي الشرقي':'شارع المدارس',genId:i<5?g1:g2,
    type:i%3===0?'amp':'meter',amps:i%3===0?(i%2?5:3):0,lastReading:1000+i*150,status:'active',joined:today()}));
  return {
    settings:{name:'مولد الحي',currency:'₪',kwhPrice:3,ampPrice:60,oilEvery:250,filterEvery:500,overhaulEvery:5000,debtLimit:200,lowFuel:100},
    generators:[
      {id:g1,name:'مولد 1 – بيركنز',kva:250,location:'الساحة الرئيسية',fuelRate:30,hours:4820,lastOil:4600,lastFilter:4400,lastOverhaul:0,tank:1000,fuelLevel:420,status:'run'},
      {id:g2,name:'مولد 2 – كمنز',kva:150,location:'الحي الشرقي',fuelRate:18,hours:2190,lastOil:1950,lastFilter:1900,lastOverhaul:0,tank:600,fuelLevel:80,status:'run'}],
    subscribers:s,invoices:[],payments:[],runs:[],fuel:[],maint:[],notices:[],bank:[],expenses:[
      {id:uid(),date:today(),cat:'رواتب',amount:1500,note:'فني المولد'},
      {id:uid(),date:today(),cat:'إيجار',amount:300,note:'أرض المولد'}]
  };
}
/* وضع السيرفر: إذا فُتحت الصفحة من وكيل الأصيل (http://localhost:8095) تُحفظ البيانات على الجهاز في data\db.json */
const SERVER=location.protocol.startsWith('http')&&/^(localhost|127.0.0.1)$/.test(location.hostname);
let _saveT=null,_bal=null,_subIx=null,_lastPay=null,_billed=null;
function norm0(){
  ['notices','bank','invoices','payments','runs','fuel','maint','expenses'].forEach(k=>DB[k]=DB[k]||[]);
  if(!DB.settings.bankInfo)DB.settings.bankInfo='بنك فلسطين – حساب رقم 0000000 باسم مولد الحي / محفظة جوال باي 059xxxxxxx';
  DB.subscribers.forEach(s=>{if(!s.pin)s.pin=String(s.phone||'0000').replace(/\D/g,'').slice(-4)||'0000'});
  dirty();
}
function load(){if(SERVER&&DB){norm0();return}
  try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB)DB=seed();norm0()}
function dirty(){_bal=_subIx=_lastPay=_billed=null}
function save(){dirty();
  if(SERVER){clearTimeout(_saveT);_saveT=setTimeout(()=>fetch('/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(stripForSave())}).catch(()=>toast('⚠ تعذّر الحفظ على الجهاز — هل الوكيل يعمل؟')),400)}
  else try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
if(!SERVER)load();

/* ===================== أدوات ===================== */
const $=s=>document.querySelector(s);
const C=()=>DB.settings.currency;
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US');
const money=n=>fmt(n)+' '+C();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gen=id=>DB.generators.find(g=>g.id===id)||{name:'—'};
function sub(id){if(!_subIx){_subIx=new Map();DB.subscribers.forEach(s=>_subIx.set(s.id,s))}return _subIx.get(id)||{name:'—'}}
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const inMonth=(d,m)=>(d||'').slice(0,7)===m;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
/* الرصيد: للمشترك المربوط بالأصيل = رصيد الأصيل − الدفعات المؤكدة هنا ولم تُسجَّل بعد في الأصيل
   لغير المربوط = فواتيره − دفعاته في هذا النظام */
function buildBal(){
  _bal=new Map();_lastPay=new Map();const add=(k,v)=>_bal.set(k,(_bal.get(k)||0)+v);
  DB.subscribers.forEach(s=>{if(s.aseelNo!=null)_bal.set(s.id,+s.aseelBal||0)});
  const linked=id=>sub(id).aseelNo!=null;
  DB.invoices.forEach(i=>{if(!linked(i.subId))add(i.subId,+i.amount||0)});
  DB.payments.forEach(p=>{const l=linked(p.subId);
    if(!l||(p.src!=='aseel'&&!p.posted))add(p.subId,-(+p.amount||0));
    if((_lastPay.get(p.subId)||'')<p.date)_lastPay.set(p.subId,p.date)});
}
function balance(sid){if(!_bal)buildBal();return _bal.get(sid)||0}
function lastPay(sid){if(!_bal)buildBal();return _lastPay.get(sid)}
function billedThisMonth(sid,m){if(!_billed||_billed.m!==m){_billed=new Set();_billed.m=m;DB.invoices.forEach(i=>{if(i.month===m)_billed.add(i.subId)})}return _billed.has(sid)}
function genOpts(sel){return DB.generators.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('')}
function subOpts(sel){return DB.subscribers.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('')}
function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem(KEY+'_t',r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem(KEY+'_t');if(t)document.documentElement.dataset.theme=t}catch(e){}

/* حالة الصيانة الذكية */
function maintStatus(g){
  const S=DB.settings,items=[];
  const chk=(label,last,every)=>{const since=g.hours-last,left=every-since,pct=Math.min(100,since/every*100);
    items.push({label,since,left,pct,level:left<=0?'bad':left<=every*0.1?'warn':'ok'})};
  chk('تغيير زيت',g.lastOil,S.oilEvery);chk('تغيير فلاتر',g.lastFilter,S.filterEvery);chk('عمرة شاملة',g.lastOverhaul,S.overhaulEvery);
  return items;
}
function fuelEff(g){ // استهلاك فعلي لتر/ساعة من آخر 30 يوم
  const from=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const h=sum(DB.runs.filter(r=>r.genId===g.id&&r.date>=from),r=>r.hours);
  const l=sum(DB.runs.filter(r=>r.genId===g.id&&r.date>=from),r=>r.liters);
  return h?l/h:null;
}
function alerts(){
  const a=[],S=DB.settings;
  DB.generators.forEach(g=>{
    maintStatus(g).forEach(m=>{if(m.level!=='ok')a.push({lvl:m.level,t:`${g.name}: ${m.label} ${m.left<=0?'متأخر بـ '+fmt(-m.left)+' ساعة':'باقي '+fmt(m.left)+' ساعة'}`})});
    if(g.tank>0&&g.fuelLevel<=S.lowFuel)a.push({lvl:'bad',t:`${g.name}: مستوى الديزل منخفض (${fmt(g.fuelLevel)} لتر) — يكفي ~${fmt(g.fuelLevel/(g.fuelRate||1))} ساعة`});
    const e=fuelEff(g);if(e&&e>g.fuelRate*1.15)a.push({lvl:'warn',t:`${g.name}: استهلاك وقود مرتفع ${fmt(e)} لتر/س مقابل المعدل ${g.fuelRate} — افحص الحقن/التسريب/السرقة`});
    if(g.status==='fault')a.push({lvl:'bad',t:`${g.name}: في حالة عطل`});
  });
  const debt=DB.subscribers.filter(s=>s.status==='active'&&balance(s.id)>=S.debtLimit);
  if(debt.length)a.push({lvl:'warn',t:`${debt.length} مشترك تجاوزت ديونهم ${money(S.debtLimit)} — راجع قائمة المتأخرين`});
  const pn=DB.notices.filter(n=>n.status==='pending').length;
  if(pn)a.unshift({lvl:'warn',t:`${pn} إشعار دفع من بوابة المشتركين بانتظار المراجعة والمطابقة مع البنك`});
  const ub=DB.bank.filter(b=>!b.matched).length;
  if(ub)a.push({lvl:'info',t:`${ub} حركة واردة في كشف البنك غير مطابقة مع أي إشعار`});
  const m=thisMonth(),notBilled=DB.subscribers.filter(s=>s.status==='active'&&s.aseelNo==null&&!billedThisMonth(s.id,m));
  if(notBilled.length)a.push({lvl:'info',t:`${notBilled.length} مشترك لم تصدر لهم فاتورة شهر ${m}`});
  return a;
}

/* ===================== التنقل ===================== */
const PAGES=[
  ['sec','الرئيسية'],['dash','📊','لوحة التحكم'],
  ['sec','المالي'],['subs','👥','المشتركون'],['bill','🧾','الفوترة'],['readings','📟','القراءات (الأصيل)'],['pay','💵','التحصيل'],['notices','📨','إشعارات الدفع'],['bank','🏦','مطابقة كشف البنك'],['debts','⚠️','المتأخرون'],['exp','📉','المصاريف'],
  ['sec','الفني'],['gens','⚙️','المولدات'],['runs','⏱️','سجل التشغيل'],['fuel','⛽','الديزل'],['maint','🔧','الصيانة'],
  ['sec','النظام'],['rep','📈','التقارير'],['set','🛠️','الإعدادات']];
let page='dash';
function renderNav(){const pn=DB.notices.filter(n=>n.status==='pending').length;
  $('#nav').innerHTML=PAGES.map(p=>p[0]==='sec'?`<div class="sec">${p[1]}</div>`:`<a class="${p[0]===page?'on':''}" onclick="go('${p[0]}')">${p[1]} ${p[2]}${p[0]==='notices'&&pn?` <span class="tag t-bad">${pn}</span>`:''}</a>`).join('')
  +`<div class="sec">البوابة</div><a href="#portal" target="_blank">🌐 بوابة المشترك (فتح)</a>`}
function go(p){page=p;side.classList.remove('on');renderNav();const P=PAGES.find(x=>x[0]===p);$('#title').textContent=P[2];$('#view').innerHTML=V[p]();window.scrollTo(0,0)}
$('#today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

/* ===================== النوافذ ===================== */
function modal(title,fields,onSave,obj={}){
  $('#mbox').innerHTML=`<h3>${title}</h3><div class="form">${fields.map(f=>{
    const v=obj[f.k]??f.d??'';
    let inp;
    if(f.t==='select')inp=`<select id="f_${f.k}">${typeof f.o==='string'?f.o:f.o.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    else if(f.t==='textarea')inp=`<textarea id="f_${f.k}" rows="2">${esc(v)}</textarea>`;
    else inp=`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.t==='number'?'step="any"':''}>`;
    return `<div class="${f.full?'full':''}"><label>${f.l}</label>${inp}</div>`}).join('')}</div>
    <div class="mfoot"><button class="btn" id="mSave">حفظ</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`;
  $('#modal').classList.add('on');
  fields.forEach(f=>{if(f.t==='select'&&typeof f.o==='string'&&obj[f.k])$('#f_'+f.k).value=obj[f.k]});
  $('#mSave').onclick=()=>{const o={};fields.forEach(f=>{let v=$('#f_'+f.k).value;if(f.t==='number')v=+v||0;o[f.k]=v});
    if(fields.some(f=>f.req&&!o[f.k])){toast('أكمل الحقول المطلوبة');return}
    onSave(o);save();closeModal();go(page);toast('تم الحفظ ✓')};
}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function del(coll,id){if(!confirm('تأكيد الحذف؟'))return;DB[coll]=DB[coll].filter(x=>x.id!==id);save();go(page);toast('تم الحذف')}

/* ===================== الصفحات ===================== */
const V={};

V.dash=()=>{
  const m=thisMonth(),inv=DB.invoices.filter(i=>i.month===m),pay=DB.payments.filter(p=>inMonth(p.date,m));
  const fuelC=sum(DB.fuel.filter(f=>inMonth(f.date,m)),f=>f.liters*f.price),mC=sum(DB.maint.filter(x=>inMonth(x.date,m)),x=>x.cost),eC=sum(DB.expenses.filter(x=>inMonth(x.date,m)),x=>x.amount);
  const billed=sum(inv,i=>i.amount),coll=sum(pay,p=>p.amount),costs=fuelC+mC+eC;
  const totalDebt=sum(DB.subscribers,s=>Math.max(0,balance(s.id)));
  const hrs=sum(DB.runs.filter(r=>inMonth(r.date,m)),r=>r.hours),kwh=sum(inv,i=>i.kwh);
  const al=alerts();
  return `<div class="grid k4">
    ${kpi('المشتركون النشطون',DB.subscribers.filter(s=>s.status==='active').length,DB.subscribers.length+' إجمالي')}
    ${kpi('فواتير الشهر',money(billed),fmt(kwh)+' ك.و.س مباعة')}
    ${kpi('المحصّل هذا الشهر',money(coll),billed?'نسبة التحصيل '+fmt(coll/billed*100)+'%':'')}
    ${kpi('إجمالي الديون',money(totalDebt),'على المشتركين','neg')}
    ${kpi('تكاليف الشهر',money(costs),'ديزل '+money(fuelC))}
    ${kpi('صافي الربح (نقدي)',money(coll-costs),'المحصل − التكاليف',coll-costs>=0?'pos':'neg')}
    ${kpi('ساعات التشغيل',fmt(hrs)+' س','هذا الشهر')}

    <div class="card"><h3>⚙️ حالة المولدات</h3>${DB.generators.map(g=>`
      <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><b>${esc(g.name)}</b>${statusTag(g.status)}</div>
      <div class="muted" style="font-size:12px">${g.kva} KVA · عداد ${fmt(g.hours)} س · ديزل ${fmt(g.fuelLevel)}/${fmt(g.tank)} لتر</div>
      <div class="bar" style="margin-top:5px"><i style="width:${Math.min(100,g.fuelLevel/g.tank*100)}%;background:${g.fuelLevel<=DB.settings.lowFuel?'var(--bad)':'var(--ok)'}"></i></div></div>`).join('')}</div>

};
function kpi(l,v,s='',cls=''){return `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`}
function statusTag(s){return {run:'<span class="tag t-ok">يعمل</span>',stop:'<span class="tag t-info">متوقف</span>',fault:'<span class="tag t-bad">عطل</span>',maint:'<span class="tag t-warn">صيانة</span>'}[s]||s}
function lastMonths(n){const r=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);r.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}return r}
function monthFin(m){
  const billed=sum(DB.invoices.filter(i=>i.month===m),i=>i.amount),coll=sum(DB.payments.filter(p=>inMonth(p.date,m)),p=>p.amount);
  const fuel=sum(DB.fuel.filter(f=>inMonth(f.date,m)),f=>f.liters*f.price),maint=sum(DB.maint.filter(x=>inMonth(x.date,m)),x=>x.cost),exp=sum(DB.expenses.filter(x=>inMonth(x.date,m)),x=>x.amount);
  return {billed,coll,fuel,maint,exp,costs:fuel+maint+exp,profit:billed-(fuel+maint+exp),cash:coll-(fuel+maint+exp)};
}
function chart6(){
  const ms=lastMonths(6),d=ms.map(m=>monthFin(m)),mx=Math.max(1,...d.map(x=>Math.max(x.billed,x.costs)));
  return `<div class="bars">${ms.map((m,i)=>`<div title="إيراد ${money(d[i].billed)} / تكاليف ${money(d[i].costs)}">
    <div style="display:flex;gap:3px;align-items:flex-end;height:140px;width:100%;justify-content:center">
    <b style="height:${d[i].billed/mx*100}%;background:var(--pri)"></b><b style="height:${d[i].costs/mx*100}%;background:var(--info)"></b></div>${m}</div>`).join('')}</div>
    <div class="muted" style="font-size:12px;margin-top:6px"><span style="color:var(--pri)">■</span> الإيراد المفوتر &nbsp; <span style="color:var(--info)">■</span> التكاليف</div>`;
}

/* حركات المشترك + الرصيد الافتتاحي (للمربوط بالأصيل: ما قبل فترة الحركات المستوردة) */
function subRows(sid){
  const s=sub(sid),L=s.aseelNo!=null;
  const inv=DB.invoices.filter(i=>i.subId===sid),pay=DB.payments.filter(p=>p.subId===sid&&!(L&&p.src!=='aseel'&&p.posted));
  const rows=[...inv.map(i=>({d:i.date,t:`فاتورة ${i.month}`+(i.kwh?` (${fmt(i.kwh)} ك.و.س${i.prev!=null?` · ${fmt(i.prev)}←${fmt(i.curr)}`:''})`:'')+(i.src==='aseel'?' · أصيل '+i.no:''),dr:+i.amount||0,cr:0})),
    ...pay.map(p=>({d:p.date,t:(p.src==='aseel'?'سند قبض أصيل '+p.no:'دفعة'+(p.src!=='aseel'&&L?' (لم تُسجّل بالأصيل بعد)':''))+(p.note?' – '+p.note:''),dr:0,cr:+p.amount||0}))].sort((a,b)=>a.d.localeCompare(b.d));
  const open=L?balance(sid)-sum(rows,r=>r.dr-r.cr):0;
  return {rows,open};
}
function statement(sid){

function prevBill(inp,prev){const id=inp.dataset.rd,v=+inp.value,k=v-prev;

  document.querySelector(`[data-a="${id}"]`).textContent=v&&k>=0?money(k*DB.settings.kwhPrice):'—'}
function issueBills(){
  const S=DB.settings;let n=0,bad=0;
  DB.subscribers.filter(s=>s.status==='active'&&s.aseelNo==null).forEach(s=>{
    if(billedThisMonth(s.id,billMonth))return;
    const carried=balance(s.id); // الرصيد المرحّل من الأشهر السابقة (موجب = دين، سالب = رصيد دائن)
    if(s.type==='amp'){DB.invoices.push({id:uid(),subId:s.id,month:billMonth,date:today(),kwh:0,amount:s.amps*S.ampPrice,amps:s.amps,carried});n++;return}
    const inp=document.querySelector(`[data-rd="${s.id}"]`);if(!inp||!inp.value)return;
    const curr=+inp.value,kwh=curr-s.lastReading;if(kwh<0){bad++;return}
    DB.invoices.push({id:uid(),subId:s.id,month:billMonth,date:today(),prev:s.lastReading,curr,kwh,amount:kwh*S.kwhPrice,rate:S.kwhPrice,carried});s.lastReading=curr;n++;

}

V.runs=()=>{const l=[...DB.runs].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="tools"><button class="btn" onclick="addRun()">+ تسجيل تشغيل يومي</button></div>

  <td class="${e>g.fuelRate*1.15?'neg':''}">${fmt(e)}</td><td>${fmt(r.counter)}</td><td>${esc(r.note||'')}</td><td><button class="btn r sm" onclick="undoRun('${r.id}')">×</button></td></tr>`}).join('')||'<tr><td colspan="10" class="muted">لا يوجد سجل</td></tr>'}</tbody></table></div>`};
function addRun(gid){
  modal('تسجيل تشغيل',[{k:'genId',l:'المولد',t:'select',o:genOpts(gid)},{k:'date',l:'التاريخ',t:'date',d:today()},
    {k:'from',l:'من الساعة',t:'time',d:'16:00'},{k:'to',l:'إلى الساعة',t:'time',d:'23:00'},
    {k:'hours',l:'عدد الساعات (يُحسب تلقائياً إن تُرك 0)',t:'number'},{k:'liters',l:'الديزل المستهلك (لتر) — 0 = حسب المعدل',t:'number'},{k:'note',l:'ملاحظات (أعطال، انقطاع...)',full:1}],
    v=>{const g=gen(v.genId);
      if(!v.hours&&v.from&&v.to){const[a,b]=v.from.split(':').map(Number),[c,d]=v.to.split(':').map(Number);let h=(c*60+d-a*60-b)/60;if(h<0)h+=24;v.hours=Math.round(h*100)/100}
      if(!v.liters)v.liters=Math.round(v.hours*g.fuelRate);
      g.hours=(+g.hours||0)+v.hours;g.fuelLevel=Math.max(0,(+g.fuelLevel||0)-v.liters);v.counter=g.hours;
      DB.runs.push({id:uid(),...v})},{genId:gid});
}

function addFuel(gid){const lp=DB.fuel.length?DB.fuel[DB.fuel.length-1].price:'';

function undoFuel(id){const f=DB.fuel.find(x=>x.id===id);if(!confirm('حذف التعبئة؟'))return;const g=gen(f.genId);g.fuelLevel=Math.max(0,g.fuelLevel-f.liters);DB.fuel=DB.fuel.filter(x=>x.id!==id);save();go(page)}

const MT={oil:'تغيير زيت',filter:'تغيير فلاتر',oilfilter:'زيت + فلاتر',overhaul:'عمرة شاملة',repair:'إصلاح عطل',parts:'قطع غيار',other:'أخرى'};

function addMaint(gid){const g0=gid?gen(gid):DB.generators[0]||{};

    {k:'cost',l:'التكلفة',t:'number'},{k:'tech',l:'الفني'},{k:'notes',l:'التفاصيل',t:'textarea',full:1}],
    v=>{const g=gen(v.genId),at=v.at||g.hours;

let repMonth=thisMonth();
V.rep=()=>{const f=monthFin(repMonth),m=repMonth;

    ${r('نسبة التحصيل',f.billed?fmt(f.coll/f.billed*100)+'%':'—')}${r('هامش الربح',f.billed?fmt(f.profit/f.billed*100)+'%':'—')}</table></div>
  <div class="card"><h3>المؤشرات الفنية – ${m}</h3><table>
    ${r('ساعات التشغيل',fmt(hrs)+' س')}${r('ديزل مستهلك',fmt(lit)+' لتر')}${r('متوسط الاستهلاك',hrs?fmt(lit/hrs)+' لتر/س':'—')}
    ${r('ك.و.س مفوترة (عدادات)',fmt(kwh))}${r('ك.و.س لكل لتر',lit&&kwh?fmt(kwh/lit):'—')}${r('تكلفة الكيلو الفعلية',kwh?money(f.costs/kwh):'—')}
    ${r('تكلفة ساعة التشغيل',hrs?money(f.costs/hrs):'—')}${r('سعر البيع للكيلو',money(DB.settings.kwhPrice))}</table>
    ${kwh&&f.costs/kwh>DB.settings.kwhPrice*0.85?'<div class="alert t-warn" style="margin-top:10px">⚠️ تكلفة الكيلو قريبة من سعر البيع — راجع التسعيرة أو الاستهلاك</div>':''}</div></div>
  <div class="card tw" style="margin-top:14px"><h3>أداء كل مولد – ${m}</h3><table><thead><tr><th>المولد</th><th>ساعات</th><th>لتر</th><th>لتر/س</th><th>تكلفة الديزل</th><th>الصيانة</th><th>الإيراد المفوتر لمشتركيه</th><th>المساهمة</th></tr></thead><tbody>
  ${DB.generators.map(g=>{const rs=DB.runs.filter(x=>x.genId===g.id&&inMonth(x.date,m)),h=sum(rs,x=>x.hours),l=sum(rs,x=>x.liters);

const norm=s=>String(s||'').replace(/[\s\-_#\/]/g,'').toLowerCase();
const dayDiff=(a,b)=>Math.abs((new Date(a)-new Date(b))/864e5);
function findMatch(n){
  let best=null;
  DB.bank.filter(b=>!b.matched||b.matched===n.id).forEach(b=>{
    if(Math.abs(b.amount-n.amount)>0.01)return;
    let sc=20;const why=['المبلغ مطابق'];
    if(n.ref&&norm(b.ref)===norm(n.ref)){sc+=60;why.push('رقم المرجع مطابق')}
    else if(n.ref&&norm(b.desc).includes(norm(n.ref))){sc+=40;why.push('المرجع موجود في البيان')}
    const d=dayDiff(b.date,n.date);
    if(d<=1){sc+=25;why.push('نفس التاريخ تقريباً')}else if(d<=3){sc+=15;why.push('فرق '+Math.round(d)+' أيام')}else if(d<=7){sc+=5;why.push('فرق '+Math.round(d)+' أيام')}else why.push('⚠ فرق '+Math.round(d)+' يوم');
    const nm=String(n.payer||sub(n.subId).name||'').split(/\s+/).filter(w=>w.length>2);
    if(nm.some(w=>String(b.desc||'').includes(w))){sc+=15;why.push('اسم المحوِّل في البيان')}
    if(!best||sc>best.sc)best={b,sc,why};
  });
  return best;
}
function matchBadge(m){if(!m)return '<span class="tag t-bad">غير موجود في كشف البنك</span>';
  return m.sc>=80?`<span class="tag t-ok">مطابقة مؤكدة ${Math.min(100,m.sc)}%</span>`:m.sc>=40?`<span class="tag t-warn">مطابقة محتملة ${m.sc}%</span>`:`<span class="tag t-bad">ضعيفة ${m.sc}%</span>`}
function dupRef(n){return n.ref&&DB.notices.some(x=>x.id!==n.id&&x.status!=='rejected'&&norm(x.ref)===norm(n.ref))}

function importBank(){

  <div class="card" style="margin-top:14px"><h3>📨 إشعاراتي</h3><div class="tw"><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>المرجع</th><th>الحالة</th></tr></thead><tbody>
    ${ns.map(n=>`<tr><td>${n.date}</td><td>${money(n.amount)}</td><td>${esc(n.ref)}</td><td>${{pending:'<span class="tag t-warn">قيد المراجعة</span>',approved:'<span class="tag t-ok">تم التأكيد ✓</span>',rejected:`<span class="tag t-bad">مرفوض</span> <span class="muted" style="font-size:11px">${esc(n.reason||'')}</span>`}[n.status]}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">لا إشعارات</td></tr>'}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>🧾 فواتيري (مع الرصيد المرحّل)</h3><div class="tw"><table><thead><tr><th>الشهر</th><th>الاستهلاك</th><th>مرحّل سابق</th><th>فاتورة الشهر</th><th>الإجمالي عند الإصدار</th></tr></thead><tbody>
    ${inv.map(i=>`<tr><td>${i.month}</td><td>${i.kwh?fmt(i.kwh)+' ك.و.س':(i.amps||s.amps)+' أمبير'}</td><td class="${(i.carried||0)>0?'neg':'pos'}">${money(i.carried||0)}</td><td>${money(i.amount)}</td><td><b>${money((i.carried||0)+i.amount)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="muted">لا فواتير</td></tr>'}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>📒 كشف الحساب</h3><div class="tw">${ledger(s.id)}</div></div>`;
}
function ledger(sid){const {rows,open}=subRows(sid);if(open)rows.unshift({d:'',t:'رصيد سابق مرحّل',dr:open>0?open:0,cr:open<0?-open:0});let bal=0;
  return `<table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>{bal+=r.dr-r.cr;return `<tr><td>${r.d}</td><td>${esc(r.t)}</td><td>${r.dr?fmt(r.dr):''}</td><td>${r.cr?fmt(r.cr):''}</td><td>${fmt(bal)}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">لا حركات</td></tr>'}</tbody></table>`}
function pLogin(){load();const ph=$('#pPhone').value.replace(/\D/g,''),pin=$('#pPin').value.trim();
  const s=DB.subscribers.find(x=>String(x.phone).replace(/\D/g,'')===ph&&String(x.pin)===pin);
  if(!s)return toast('رقم الجوال أو الرمز غير صحيح');if(s.status!=='active'&&balance(s.id)<=0)return toast('الاشتراك غير نشط');
  me=s.id;try{sessionStorage.setItem(KEY+'_me',me)}catch(e){}renderPortal()}
function pLogout(){me=null;try{sessionStorage.removeItem(KEY+'_me')}catch(e){}renderPortal()}
function shrink(file){return new Promise(res=>{if(!file)return res('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=()=>res('');im.src=r.result};r.readAsDataURL(file)})}
async function pSend(){const amt=+$('#nAmt').value,ref=$('#nRef').value.trim(),date=$('#nDate').value;
  if(!(amt>0)||!ref||!date)return toast('أدخل المبلغ والتاريخ ورقم المرجع');
  const img=await shrink($('#nImg').files[0]);load();
  if(DB.notices.some(n=>n.subId===me&&norm(n.ref)===norm(ref)&&n.status!=='rejected'))return toast('هذا المرجع مرسل مسبقاً');
  DB.notices.push({id:uid(),subId:me,amount:amt,date,method:$('#nMethod').value,ref,payer:$('#nPayer').value.trim(),img,status:'pending',sent:new Date().toISOString()});
  save();renderPortal();toast('تم إرسال الإشعار ✓ سيتم تأكيده بعد المطابقة مع البنك')}

/* تحديث فوري بين تبويب الإدارة وتبويب البوابة */
window.addEventListener('storage',e=>{if(e.key!==KEY)return;if(location.hash==='#portal'){if(!document.activeElement||document.activeElement.tagName!=='INPUT')renderPortal()}
  else{load();renderNav();if(!$('#modal').classList.contains('on')&&['dash','notices','bank','pay','debts','subs'].includes(page)){go(page);if(e.newValue&&page!=='notices')toast('📨 تحديث جديد من بوابة المشتركين')}}});

/* بيانات تجريبية للشهر: تشغيل وتعبئة لتظهر اللوحة حيّة */
function addDemo(){if(!DB._demo){DB._demo=1;const g=DB.generators;if(g.length===2&&!DB.runs.length){
  for(let i=6;i>=1;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
    DB.runs.push({id:uid(),genId:g[0].id,date:d,from:'16:00',to:'00:00',hours:8,liters:i===2?310:240,counter:g[0].hours-(i-1)*8,note:''});
    DB.runs.push({id:uid(),genId:g[1].id,date:d,from:'17:00',to:'23:00',hours:6,liters:108,counter:g[1].hours-(i-1)*6,note:''});}
  DB.fuel.push({id:uid(),genId:g[0].id,date:today(),liters:1000,price:6.5,supplier:'محطة المحروقات'});
  DB.maint.push({id:uid(),genId:g[1].id,date:today(),type:'oilfilter',at:1950,cost:450,tech:'أبو سامي',notes:'زيت 15W40 + فلتر ديزل'});
}
  /* فواتير الشهر الماضي + إشعارات دفع + كشف بنك للتجربة */
  const lm=lastMonths(2)[0],S=DB.settings,ss=DB.subscribers;
  ss.forEach((s,i)=>DB.invoices.push({id:uid(),subId:s.id,month:lm,date:lm+'-28',carried:0,...(s.type==='amp'?{kwh:0,amps:s.amps,amount:s.amps*S.ampPrice}:{prev:s.lastReading-60-i*10,curr:s.lastReading,kwh:60+i*10,rate:S.kwhPrice,amount:(60+i*10)*S.kwhPrice})}));
  const d1=new Date(Date.now()-2*864e5).toISOString().slice(0,10),d2=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(ss.length>=4){
    DB.payments.push({id:uid(),subId:ss[2].id,amount:balance(ss[2].id),date:d1,method:'نقدي',note:''});
    const a1=balance(ss[1].id),a3=balance(ss[3].id);
    DB.notices.push({id:uid(),subId:ss[1].id,amount:a1,date:d1,method:'تطبيق بنكي',ref:'TRX-88213',payer:ss[1].name,img:'',status:'pending',sent:d1+'T18:20'});
    DB.notices.push({id:uid(),subId:ss[3].id,amount:a3,date:d2,method:'محفظة إلكترونية',ref:'PP55190',payer:'رامي الشاعر',img:'',status:'pending',sent:d2+'T20:05'});
    DB.notices.push({id:uid(),subId:ss[4].id,amount:100,date:d2,method:'تحويل بنكي',ref:'77001',payer:ss[4].name,img:'',status:'pending',sent:d2+'T21:40'});
    DB.bank.push({id:uid(),date:d1,amount:a1,ref:'TRX88213',desc:'حوالة واردة من '+ss[1].name,matched:null});
    DB.bank.push({id:uid(),date:d2,amount:a3,ref:'',desc:'تحويل محفظة PP55190 رامي الشاعر',matched:null});
    DB.bank.push({id:uid(),date:d2,amount:90,ref:'X3321',desc:'إيداع نقدي بدون اسم',matched:null});
  }
save()}}

/* ===================== الربط مع الأصيل ===================== */
let ASEEL=null;
function seedEmpty(){const d=seed();d.subscribers=[];d.expenses=[];d._demo=1;
  d.generators=[{id:uid(),name:'المولد الرئيسي',kva:0,location:'',fuelRate:0,hours:0,lastOil:0,lastFilter:0,lastOverhaul:0,tank:0,fuelLevel:0,status:'run'}];
  d.settings.name='مولدات';return d}
/* يدمج بيانات الأصيل: المشتركين (إضافة/تحديث)، الفواتير والقراءات وسندات القبض (في الذاكرة فقط — لا تُحفظ مكرّرة) */
function mergeAseel(j){
  ASEEL=j;const S=DB.settings;let added=0;
  if(j.group&&(!S.name||S.name==='مولد الحي'||S.name==='مولدات'))S.name=j.group;
  if(j.item&&j.item.price)S.kwhPrice=j.item.price;
  const byNo=new Map();DB.subscribers.forEach(s=>{if(s.aseelNo!=null)byNo.set(s.aseelNo,s)});
  const g0=(DB.generators[0]||{}).id;
  j.subs.forEach(a=>{let s=byNo.get(a.no);
    if(!s){s={id:'a'+a.no,aseelNo:a.no,type:'meter',amps:0,genId:g0,status:'active',joined:a.open||'',pin:(String(a.ph||'').replace(/\D/g,'').slice(-4)||'0000')};DB.subscribers.push(s);byNo.set(a.no,s);added++}
    Object.assign(s,{name:a.name,phone:a.ph,phone2:a.ph2||'',area:a.addr,panel:a.panel,street:a.street,aseelBal:a.bal,lastReading:a.read??s.lastReading??0,readDt:a.readDt||'',lastTx:a.lastTx||''});
    if(!a.act)s.status='cut';else if(s.status==='cut'&&s.cutBy!=='app')s.status='active';
  });
  const sid=no=>{const s=byNo.get(no);return s&&s.id};
  DB.invoices=DB.invoices.filter(i=>i.src!=='aseel').concat(j.bills.filter(b=>sid(b.d)).map(b=>({id:'B'+b.iu,src:'aseel',no:b.no,subId:sid(b.d),month:b.dt.slice(0,7),date:b.dt,kwh:b.kwh,rate:b.pr,amount:b.amt,prev:b.prev,curr:b.cur,ret:b.ret})));
  const recs=j.receipts.filter(r=>sid(r.d)).map(r=>({id:'R'+r.iu,src:'aseel',no:r.no||r.iu,subId:sid(r.d),date:r.dt,amount:r.amt,method:'سند قبض أصيل',note:r.rem||''}));
  // دفعة مؤكدة هنا (بوابة/تحصيل) تُعتبر «مسجّلة في الأصيل» إذا ظهر سند قبض لنفس المشترك بنفس المبلغ بعدها بـ ≤ 10 أيام
  const used=new Set();
  DB.payments.filter(p=>p.src!=='aseel'&&!p.posted&&sub(p.subId).aseelNo!=null).sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
    const r=recs.find(r=>!used.has(r.id)&&r.subId===p.subId&&Math.abs(r.amount-p.amount)<0.01&&r.date>=p.date&&dayDiff(r.date,p.date)<=10);
    if(r){used.add(r.id);p.posted=true;p.postedNo=r.no}});
  DB.payments=DB.payments.filter(p=>p.src!=='aseel').concat(recs);
  dirty();return added;
}
function stripForSave(){return Object.assign({},DB,{invoices:DB.invoices.filter(i=>i.src!=='aseel'),payments:DB.payments.filter(p=>p.src!=='aseel')})}
async function pullAseel(force){
  try{const r=await fetch('/aseel.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(!force&&ASEEL&&ASEEL.generated===j.generated)return;
    const before=DB.subscribers.length,added=mergeAseel(j);save();
    if(location.hash==='#portal'){renderPortal();return}
    renderNav();if(!$('#modal').classList.contains('on'))go(page);
    if(force||added)toast(`🔗 تم التحديث من الأصيل${added?` · ${added} مشترك جديد`:''}`);
  }catch(e){}
}
async function syncNow(){try{await fetch('/sync',{method:'POST'})}catch(e){}await pullAseel(true)}

async function boot(){
  if(SERVER){
    try{const r=await fetch('/db',{cache:'no-store'});DB=r.ok?await r.json():seedEmpty()}catch(e){DB=seedEmpty()}
    norm0();await pullAseel(true);setInterval(()=>pullAseel(false),60000);
  }else addDemo();
  if(location.hash==='#portal')renderPortal();else{renderNav();go('dash')}
}
boot();
window.addEventListener('hashchange',()=>location.reload());
</script>
